name: fuzz

# Live fuzzing runs on a schedule, not on a pull request.
#
# The pull request job was removed after its first week: `go test -fuzz` with a
# ten-second budget is probabilistic, and on #116 a trivially cheap target
# (`FuzzEstimate` calls Estimate once) failed with "context deadline exceeded"
# while the deadline tripped during shutdown. No failing input was written --
# the uploaded corpus held only the committed seeds -- so a required check
# reported failure without finding anything. A gate that cries wolf on a busy
# runner is worse than one that runs at night.
#
# Nothing is lost on a pull request: `go test`, and so `make race`, already
# replays every committed seed corpus in testdata/fuzz. What a PR cannot do is
# explore new inputs, and that is what this workflow is for.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Seconds per fuzz target"
        type: string
        default: "60s"

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The matrix is derived rather than written down, so a new fuzz target is
  # picked up by being committed and a moved one cannot leave a job behind.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.list.outputs.packages }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - id: list
        name: List the packages holding fuzz targets
        run: |
          set -eu
          # make fuzz-packages is the same source a local run uses.
          packages=$(make -s fuzz-packages | tr ' ' '\n' | sed 's|^\./||; s|/$||' | grep -v '^$' | jq -R . | jq -sc .)
          test "${packages}" != "[]" || { echo "::error::no fuzz targets found"; exit 1; }
          echo "packages=${packages}" >>"$GITHUB_OUTPUT"
          echo "sharding over ${packages}"

  fuzz:
    needs: packages
    runs-on: ubuntu-latest
    # A package with five targets costs five minutes; nothing has more.
    timeout-minutes: 30
    strategy:
      # One crashing package must not cancel the other thirty-seven: the point of
      # a shard per package is to see every failure in one run.
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.packages) }}
    env:
      # Go's -fuzz takes one target, so the loop below is per target, and a
      # package with three targets gets three times this.
      FUZZTIME: ${{ inputs.fuzztime || '60s' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # A green run means "no crash in the time it was given", not "this parser
      # is safe". Longer than this belongs to a deliberate campaign, not a gate.
      - name: Fuzz every target in ${{ matrix.package }}
        run: |
          set -eu
          # The list is captured first, because a command substitution in a for
          # list is not a command: a failing `go test -list` there would run the
          # loop zero times and report success.
          listing=$(go test -list '^Fuzz' "./${{ matrix.package }}")
          targets=$(printf '%s\n' "${listing}" | sed -n '/^Fuzz/p')
          test -n "${targets}" || { echo "::error::no fuzz targets found in ./${{ matrix.package }}"; exit 1; }
          for target in ${targets}; do
            echo "::group::${target} in ${{ matrix.package }} (${FUZZTIME})"
            go test -run '^$' -fuzz "^${target}$" -fuzztime "${FUZZTIME}" "./${{ matrix.package }}"
            echo "::endgroup::"
          done
      # A crash is only actionable with its input. Scoped to this shard: the
      # glob used to reach into every other package's committed corpus too.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus-${{ strategy.job-index }}
          path: "${{ matrix.package }}/testdata/fuzz/**"
          if-no-files-found: ignore
          retention-days: 7
