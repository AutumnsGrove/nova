# Nova reviews its own pull requests, with the action it ships.
#
# pi-review stays. It checks out the merge commit and runs the code; Nova's
# reviewer is read-only -- read, list, glob, grep, and the two review tools --
# so it looks at the diff rather than at behaviour. The overlap is deliberate:
# the point of this workflow is that the action is exercised by the pull
# requests that change it, not that a second opinion is cheap.
name: nova-review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # An issue_comment payload carries the pull request as `issue`, and no
  # `pull_request`, so the number has to be passed to the action explicitly.
  issue_comment:
    types: [created]
  # For a rehearsal (`-f dry_run=true`) and for re-running a review on a pull
  # request that was reviewed before the action could be trusted to.
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number to review"
        type: string
        required: true
      dry_run:
        description: "Print the review without posting it"
        type: boolean
        default: false

# One review per pull request at a time. A push to a pull request that is being
# reviewed supersedes the run it replaced, rather than two of them racing to
# post and paying for the same diff twice.
concurrency:
  # One review per pull request at a time, so a push to a pull request that is
  # being reviewed supersedes the run it replaced rather than racing it.
  #
  # A run the job will skip must not take the pull request's group: this is
  # evaluated before the job's `if`, and with `cancel-in-progress` a comment that
  # does not ask for a review would cancel the review already running. The same
  # eligibility condition is therefore folded into the key, so an ignored run
  # takes a unique group of its own. It is kept in step with the job's `if`, and
  # ACT07 asserts both name the same predicates.
  group: >-
    ${{
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@nova') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.comment.user.type != 'Bot') ||
       github.event_name == 'workflow_dispatch')
      && format('nova-review-{0}', github.event.pull_request.number || github.event.issue.number || inputs.pr)
      || format('nova-review-ignored-{0}', github.run_id)
    }}
  cancel-in-progress: true

# Reading the pull request and posting one review, and nothing else. The write
# token and the model key both sit in this job, so the scope is the permission
# set and the `if` below, not a comment.
permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    # The job builds and runs the pull request's own copy of Nova, so it only
    # ever runs on a branch in this repository, opened by a person, out of draft,
    # and asked for by someone who can push here. A fork is refused twice over:
    # its token is read-only and its secrets are withheld, so a review could not
    # be posted from one anyway.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.user.type != 'Bot') ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '@nova') &&
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
       github.event.comment.user.type != 'Bot') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
    steps:
      - name: Check the head is in this repository
        id: head
        # A pull_request payload carries the head repository and the job `if`
        # already refuses a fork there. A comment and a manual run carry no such
        # field, and both check out refs/pull/<n>/head, which exists for a fork
        # too, so the API decides before anything from that checkout runs. A
        # failed request fails closed.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ env.PR }}
        run: |
          if head=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}" --jq '.head.repo.full_name') &&
             [ "${head}" = "${GITHUB_REPOSITORY}" ]; then
            echo "fork=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Nova review skipped: pull request ${PR} does not come from ${GITHUB_REPOSITORY}"
            echo "fork=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.head.outputs.fork == 'false'
        with:
          # A comment and a manual run both check out the default branch, so the
          # head is named: the reviewer reads the files the diff is about.
          ref: refs/pull/${{ env.PR }}/head
          persist-credentials: false
      # The action in this checkout, not a published tag: a change to
      # `action.yml` or to the review itself is what the next pull request
      # exercises. The cost of that is a pull request that does not build
      # failing its own review, which is the answer worth having.
      #
      # This holds for every run here, not only for a dispatch or a comment: the
      # checkout is refs/pull/<n>/head, so a head older than a change to
      # `action.yml` is reviewed by its own action rather than this branch's. A
      # head older than the fallback in #134 fails its own `go install` outright
      # (that is what #136 hit), which is loud rather than silent.
      - name: Check the cost cap
        if: steps.head.outputs.fork == 'false'
        # A number typed into repository settings reaches a float flag, and the
        # two likely typos are both worse than the default: "$1.00" fails flag
        # parsing and reddens the job with no review posted, and "0" means no
        # cap at all, which deletes the guard while looking like a tight one.
        # A typo is a loud, self-describing failure instead.
        env:
          CAP: ${{ vars.NOVA_REVIEW_MAX_COST }}
        run: |
          if [ -z "${CAP}" ]; then
            exit 0
          fi
          if ! printf '%s' "${CAP}" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
            echo "::error::NOVA_REVIEW_MAX_COST must be a plain number of US dollars such as 0.5, not '${CAP}'"
            exit 1
          fi
          if printf '%s' "${CAP}" | grep -Eq '^0+(\.0+)?$'; then
            echo "::error::NOVA_REVIEW_MAX_COST is 0, and 0 means no cap at all; delete the variable for the 0.5 default, or set a positive number"
            exit 1
          fi
      - uses: ./
        if: steps.head.outputs.fork == 'false'
        with:
          model: opencode-go/deepseek-v4.1-flash
          max-comments: "15"
          # A runaway guard, not a budget: a typical review costs about $0.014.
          # Tunable from repository settings (a NOVA_REVIEW_MAX_COST variable) so
          # the number can move without a commit to this file; the step above
          # refuses a value that is not a positive number.
          max-cost: ${{ vars.NOVA_REVIEW_MAX_COST || '0.5' }}
          wall-clock: 10m
          pr: ${{ env.PR }}
          dry-run: ${{ inputs.dry_run || 'false' }}
          opencode-go-api-key: ${{ secrets.PI_REVIEW_API_KEY }}
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          github-token: ${{ github.token }}
