name: release

on:
  push:
    tags:
      - "v*"
  # The gate is the part that fails, and it has failed on three tags in a row.
  # A manual run checks the whole accept loop on the branch before anything is
  # tagged; only the accept job runs, because build and release need a tag ref.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Accept every chunk
        run: |
          set -eu
          for spec in docs/archive/chunks/C*.md; do
            chunk=$(basename "$spec" | cut -d- -f1)
            echo "== accept $chunk =="
            go run ./scripts/accept "$chunk"
          done

  build:
    needs: accept
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, darwin]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build both flavours
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          version="${GITHUB_REF_NAME}"
          commit="${GITHUB_SHA}"
          date="$(date -u +%Y-%m-%d)"
          ldflags="-s -w -X main.version=${version} -X main.commit=${commit} -X main.date=${date}"
          mkdir -p dist
          go build -trimpath -ldflags "$ldflags" -o dist/nova ./cmd/nova
          go build -trimpath -tags notui -ldflags "$ldflags" -o dist/nova-min ./cmd/nova
      - name: Package and checksum
        run: ./scripts/package.sh "${GITHUB_REF_NAME}" "${{ matrix.os }}" "${{ matrix.arch }}" dist/nova dist/nova-min dist
      - uses: actions/upload-artifact@v4
        with:
          name: nova-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*.tar.gz

  release:
    needs: build
    # The only job that needs a tag: a workflow_dispatch run builds the four
    # archives and stops, which is how a broken script is found before a tag.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job that publishes, so the only one that may write.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # The body is written from the tag range, so the whole history and
          # every tag have to be here.
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          set -eu
          cd dist
          # Bare file names: install.sh and `nova update` look an archive up by
          # name, and "./name" would never match.
          sha256sum -- *.tar.gz | sort -k2 >checksums.txt
          cat checksums.txt
      - name: Install pi
        run: npm install -g @earendil-works/pi-coding-agent@1.5.0
      - name: Write release notes
        id: notes
        # A body is a courtesy, so nothing here may fail the release: the script
        # falls back to the changelog section on its own, and this step warns
        # rather than stopping when even that is missing. It is built rather than
        # run, because `go run` collapses every non-zero status to 1 and status 3
        # is how the script says the fallback produced the body.
        continue-on-error: true
        timeout-minutes: 8
        env:
          OPENCODE_API_KEY: ${{ secrets.PI_REVIEW_API_KEY }}
        run: |
          set -u
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          echo "release-notes range: ${previous:-<first release>}..${GITHUB_REF_NAME}"
          go build -o "$RUNNER_TEMP/release-notes" ./scripts/release-notes || exit 0
          # Flags come first: Go's flag package stops at the first ref, so a
          # flag after the range is a usage error and no body at all.
          status=0
          "$RUNNER_TEMP/release-notes" --out body.md "$previous" "$GITHUB_REF_NAME" || status=$?
          if [ "$status" = 3 ]; then
            echo "::warning::the release body is the changelog fallback, not a summary: see release-notes above"
          elif [ "$status" != 0 ]; then
            echo "::warning::release-notes exited $status"
          fi
          if [ -s body.md ]; then
            echo "body=body.md" >>"$GITHUB_OUTPUT"
          else
            echo "::warning::no release body: the agent failed and the changelog has no section for ${GITHUB_REF_NAME}"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          # Empty when there is nothing to say, and action-gh-release ignores an
          # empty body_path, so the release publishes with no body as before.
          body_path: ${{ steps.notes.outputs.body }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
