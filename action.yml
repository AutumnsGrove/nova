name: Nova review
description: Review a pull request with Nova and post one comment review.
inputs:
  model:
    description: Model id to review with.
    required: false
  max-comments:
    description: Maximum number of inline comments.
    required: false
    default: "15"
  max-cost:
    description: Maximum model cost in USD (0 means unlimited).
    required: false
    default: "0"
  wall-clock:
    description: Wall-clock limit for the review, e.g. 15m or 30s (0 means no limit).
    required: false
    default: "15m"
  openrouter-api-key:
    description: OpenRouter API key. Omit on pull requests from forks.
    required: false
  github-token:
    description: Token used to read the pull request and post the review.
    required: true
    default: ${{ github.token }}
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v5
      with:
        go-version: "1.26"
    - name: Install Nova
      shell: bash
      env:
        ACTION_REF: ${{ github.action_ref }}
      run: go install -tags notui "github.com/AutumnsGrove/nova/cmd/nova@${ACTION_REF}"
    - name: Review the pull request
      shell: bash
      # Inputs reach the script through the environment, never as ${{ }} text in
      # the script, so no value can be read as shell code.
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_COMMENTS: ${{ inputs.max-comments }}
        INPUT_MAX_COST: ${{ inputs.max-cost }}
        INPUT_WALL_CLOCK: ${{ inputs.wall-clock }}
      run: >-
        nova action review
        --model "$INPUT_MODEL"
        --max-comments "$INPUT_MAX_COMMENTS"
        --max-cost "$INPUT_MAX_COST"
        --wall-clock "$INPUT_WALL_CLOCK"
