name: hello
version: 0.1.0
description: A declarative greeting tool that needs no process.
nova: ">=0.1"
tools:
  - name: hello
    description: Greets someone by name.
    parameters:
      type: object
      properties:
        name: { type: string, description: Who to greet }
      required: [name]
    exec: ["printf", "Hello, %s!", "{{.name}}"]
    read_only: true
    render: "{{.output}}"
